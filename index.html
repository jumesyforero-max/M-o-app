<meta name="theme-color" content="#06121d">

<meta name="color-scheme" content="light dark"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no">
<script>
window.showErr=function(m){try{var d=document.createElement('div');d.style.cssText='position:fixed;left:12px;right:12px;top:20px;z-index:999;padding:16px;border-radius:20px;background:#fff;color:#0b2540;font:15px -apple-system,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3)';var title=document.createElement('b');title.textContent='MIO no pudo iniciar.';var msg=document.createElement('small');msg.textContent=String(m);msg.style.display='block';var br=document.createElement('br');var btn=document.createElement('button');btn.textContent='Reintentar sin borrar datos';btn.style.cssText='width:100%;min-height:50px;border:0;border-radius:14px;background:#087CF0;color:#fff;font-size:16px;font-weight:700';btn.onclick=function(){location.reload()};d.append(title,br,msg,br.cloneNode(),btn);document.body.appendChild(d)}catch(e){}};
window.addEventListener('error',function(e){showErr(e.message||'Error de JavaScript')});
</script>
<title>MIO · Tus finanzas, tu control</title>
<style>
:root{--g:#22C55E;--t:#00D1C1;--b:#087CF0;--w:#FFFFFF;--tx:#0b2540;--mut:#51698a;--glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.75);--st:rgba(255,255,255,.85);--bg:#eefcf7;--in:rgba(255,255,255,.7);--sh:0 10px 34px rgba(8,124,240,.14);--red:#ef4444;--amb:#f59e0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#eaf6ff;--mut:#9db4cc;--glass:rgba(18,38,58,.55);--glass2:rgba(18,38,58,.85);--st:rgba(255,255,255,.14);--bg:#06121d;--in:rgba(255,255,255,.08);--sh:0 10px 34px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--tx:#eaf6ff;--mut:#9db4cc;--glass:rgba(18,38,58,.55);--glass2:rgba(18,38,58,.85);--st:rgba(255,255,255,.14);--bg:#06121d;--in:rgba(255,255,255,.08);--sh:0 10px 34px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-text-size-adjust:100%}
.bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;background:radial-gradient(60% 40% at 0% 0%,rgba(34,197,94,.45),transparent 70%),radial-gradient(55% 40% at 100% 20%,rgba(8,124,240,.38),transparent 70%),radial-gradient(60% 40% at 30% 100%,rgba(0,209,193,.4),transparent 70%)}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:14px 16px 130px}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);border:1px solid var(--st);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),var(--sh);padding:16px;margin-bottom:14px;position:relative}
h1,h2,h3,p{margin:0}
h2{font-size:18px;font-weight:700;margin-bottom:10px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-size:30px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,var(--g),var(--t),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.slogan{font-size:13px;color:var(--mut)}
.ib{-webkit-appearance:none;appearance:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--st);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:22px;color:var(--tx);cursor:pointer}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mn b{font-size:17px;text-transform:capitalize}
.mn button{width:44px;height:44px;border-radius:50%;border:1px solid var(--st);background:var(--glass);font-size:18px;color:var(--tx);cursor:pointer}
.hero{background:linear-gradient(135deg,var(--g),var(--t) 55%,var(--b));color:#fff;border:1px solid rgba(255,255,255,.6)}
.hero .l{font-size:14px;opacity:.9}.hero .big{font-size:36px;font-weight:800;margin:2px 0 14px;letter-spacing:-.5px}
.pills{display:flex;gap:10px}.pill{flex:1;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:18px;padding:10px 12px}
.pill small{display:block;font-size:12px;opacity:.9}.pill b{font-size:16px}
.demo{display:flex;gap:10px;align-items:center;font-size:13px;border-color:var(--amb)}
.chip{font-size:10px;font-weight:700;background:var(--amb);color:#fff;border-radius:8px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.btn{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:54px;border:0;border-radius:18px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g),var(--t) 55%,var(--b));cursor:pointer;box-shadow:0 6px 18px rgba(8,124,240,.3)}
.btn.s{background:var(--glass2);color:var(--tx);border:1px solid var(--st);box-shadow:none}
.btn.d{background:var(--red)}
.btn.sm{width:auto;min-height:44px;padding:0 16px;font-size:14px;display:inline-block}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--st);cursor:pointer}
.row:last-child{border:0}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none}
.grow{flex:1;min-width:0}.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow small,.mut{color:var(--mut);font-size:13px}
.amt{font-weight:700;white-space:nowrap}.in{color:var(--g)}.out{color:var(--tx)}
.seg{display:flex;background:var(--in);border-radius:16px;padding 4px;padding:4px;gap:4px;margin-bottom:12px;border:1px solid var(--st)}
.seg button{flex:1;min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--tx);font-size:15px;font-weight:600;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--g),var(--b));color:#fff}
.bar{height:12px;background:var(--in);border-radius:8px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--st)}
.bar i{display:block;height:100%;border-radius:8px}
.leg{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}.leg i{width:12px;height:12px;border-radius:4px;flex:none}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-around;padding:8px 6px;border-radius:32px;background:var(--glass2);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);border:1px solid var(--st);box-shadow:var(--sh);z-index:20}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font-size:11px;font-weight:600;min-height:52px;cursor:pointer}
.tabs button span{display:block;font-size:22px}.tabs button.on{color:var(--b)}
.tabs .fab{flex:none;width:62px;height:62px;border-radius:50%;margin:-26px 4px 0;color:#fff;background:linear-gradient(135deg,var(--g),var(--t),var(--b));font-size:34px;font-weight:300;box-shadow:0 8px 22px rgba(8,124,240,.4);border:2px solid #fff}
.sb{position:fixed;inset:0;background:rgba(5,20,35,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--glass2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--st);border-radius:30px 30px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{-webkit-appearance:none;appearance:none;width:100%;min-height:50px;border-radius:16px;border:1px solid var(--st);background:var(--in);color:var(--tx);font-size:17px;padding:0 14px;font-family:inherit}
input.big{font-size:28px;font-weight:800;min-height:62px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:99}
.empty{text-align:center;color:var(--mut);padding:18px 0}
.warn{color:var(--amb)}
</style></head>
<body><div class="bg"></div>
<noscript><div style="position:relative;z-index:2;margin:16px;padding:16px;border-radius:20px;background:#fff;color:#0b2540;font:15px -apple-system,sans-serif"><b>Vista previa sin JavaScript.</b> Este visor no ejecuta la app: los botones no funcionan aquí. Abre el archivo en <b>Safari</b> (Compartir → Abrir en Safari) o usa el enlace publicado.</div></noscript>
<div id="app"></div>
<nav class="tabs" id="tabs"><button class="on" onclick="go('home')"><span>🏠</span>Inicio</button><button class="" onclick="go('movs')"><span>🧾</span>Movimientos</button><button class="fab" onclick="openTx()" aria-label="Nuevo movimiento">+</button><button class="" onclick="go('bud')"><span>📊</span>Presupuesto</button><button class="" onclick="go('goals')"><span>🎯</span>Metas</button></nav>
<script>
const K='mio_v1';
const C={'Mercado':['🛒','#22C55E'],'Transporte':['🚌','#087CF0'],'Comida fuera':['🍽️','#F59E0B'],'Café y snacks':['☕','#A855F7'],'Domicilios':['🛵','#EF4444'],'Servicios':['💡','#00D1C1'],'Arriendo':['🏠','#64748B'],'Salud':['💊','#EC4899'],'Ocio':['🎬','#6366F1'],'Otros gastos':['📦','#94A3B8'],'Salario':['💼','#22C55E'],'Freelance':['💻','#00D1C1'],'Otros ingresos':['💰','#087CF0']};
const EX=[],IN=['Salario','Freelance','Otros ingresos'];
function catNames(type){const base=type==='g'?EX:IN;return [...base,...(S.customCats||[]).filter(x=>x.type===type).map(x=>x.name)]}
function catInfo(name){const x=(S.customCats||[]).find(c=>c.name===name);const preset=C[name];return x?[x.icon||'📦',x.color||'#00D1C1']:(preset&&Array.isArray(preset)?preset:['📦','#94A3B8'])}
const HM=35000;
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tab='home',flt='all',now=new Date(),M={y:now.getFullYear(),m:now.getMonth()};
function seed(){return{hide:false,customCats:[],tx:[],bud:{},goals:[],salaryPlan:null,profile:{name:'',phone:''}}}
let S=(()=>{try{const r=JSON.parse(localStorage.getItem(K));if(r&&Array.isArray(r.tx)&&Array.isArray(r.goals)&&r.bud){if(!Array.isArray(r.customCats))r.customCats=[];if(!r.profile)r.profile={name:'',phone:''};return r}}catch(e){}return seed()})();
function save(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){toast('No se pudieron guardar los datos en este navegador. Libera espacio o revisa la configuración de privacidad.');return false}}
const cop=n=>S.hide?'$ ••••••':new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const mk=()=>`${M.y}-${pad(M.m+1)}`;
const mtx=()=>S.tx.filter(t=>t.d.startsWith(mk())).sort((a,b)=>b.d.localeCompare(a.d));
const sum=(l,t)=>l.filter(x=>x.t==t).reduce((s,x)=>s+x.a,0);
const mlabel=()=>new Date(M.y,M.m,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'});
const dlabel=d=>new Date(d+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
function byCat(l){const o={};l.filter(t=>t.t=='g').forEach(t=>o[t.c]=(o[t.c]||0)+t.a);return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function smallExpenseGroups(l){const o={};l.filter(t=>t.t==='g'&&Number(t.a)<=HM).forEach(t=>{(o[t.c]=o[t.c]||{n:0,s:0}).n++;o[t.c].s+=Number(t.a)||0});return Object.entries(o).map(([c,v])=>({c,...v,remaining:Math.max(0,3-v.n)})).sort((a,b)=>b.s-a.s)}
function hormiga(l){return smallExpenseGroups(l).filter(x=>x.n>=3)}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function go(t){tab=t;render();scrollTo(0,0)}
function mv(d){const x=new Date(M.y,M.m+d,1);M={y:x.getFullYear(),m:x.getMonth()};render()}
function eye(){S.hide=!S.hide;save();render()}
const mnav=()=>`<div class="mn"><button onclick="mv(-1)" aria-label="Mes anterior">‹</button><b>${mlabel()}</b><button onclick="mv(1)" aria-label="Mes siguiente">›</button></div>`;
const rowTx=t=>{const[ic,col]=catInfo(t.c);return`<div class="row" onclick="openTx('${t.id}')"><div class="ic" style="background:${col}26">${ic}</div><div class="grow"><b>${esc(t.n)||t.c}${t.demo?'<span class="chip">DEMO</span>':''}</b><small>${t.c} · ${dlabel(t.d)}</small></div><div class="amt ${t.t=='i'?'in':'out'}">${t.t=='i'?'+':'−'}${cop(t.a)}</div></div>`};

function donut(l){const c=byCat(l),tot=c.reduce((s,x)=>s+x[1],0);if(!tot)return'<p class="empty">Sin gastos este mes. Toca + para registrar.</p>';
let off=25,arcs='';c.forEach(([k,v])=>{const p=v/tot*100;arcs+=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${catInfo(k)[1]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p});
return`<svg viewBox="0 0 42 42" style="width:200px;display:block;margin:0 auto 8px"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--in)" stroke-width="6"/>${arcs}<text x="21" y="20" text-anchor="middle" font-size="3" fill="var(--mut)">Gastos</text><text x="21" y="25" text-anchor="middle" font-size="3.6" font-weight="800" fill="var(--tx)">${S.hide?'••••':new Intl.NumberFormat('es-CO',{notation:'compact',maximumFractionDigits:1}).format(tot)}</text></svg>`+c.map(([k,v])=>`<div class="leg"><i style="background:${catInfo(k)[1]}"></i><span class="grow">${catInfo(k)[0]} ${esc(k)}</span><b>${S.hide?'••':Math.round(v/tot*100)+'%'}</b><span class="mut" style="min-width:92px;text-align:right">${cop(v)}</span></div>`).join('')}

function salaryCard(){
if(!S.salaryPlan)return '<div class="glass"><h2>💰 Mi plan de salario</h2><p class="mut">Cuando registres un ingreso de categoría Salario, podrás aceptar una recomendación 50/30/20 o ajustar los porcentajes.</p></div>';
const p=S.salaryPlan;
return `<div class="glass"><h2>💰 Mi plan de salario</h2><p class="mut">Distribución aceptada para ${dlabel(p.date)} · ${cop(p.amount)}</p><div class="row" style="cursor:default"><div class="grow"><b>🏠 Necesidades · ${p.needsPct}%</b></div><div class="amt">${cop(p.needs)}</div></div><div class="row" style="cursor:default"><div class="grow"><b>🎉 Deseos · ${p.wantsPct}%</b></div><div class="amt">${cop(p.wants)}</div></div><div class="row" style="cursor:default"><div class="grow"><b>🌱 Ahorro y deudas · ${p.savingPct}%</b></div><div class="amt">${cop(p.saving)}</div></div><button class="btn s" style="margin-top:10px" onclick="salaryPlan(${p.amount},'${p.date}')">Ajustar distribución</button></div>`;
}

function home(){const l=mtx(),i=sum(l,'i'),g=sum(l,'g'),h=hormiga(l),hs=h.reduce((s,x)=>s+x.s,0),dm=S.tx.some(t=>t.demo)||S.goals.some(x=>x.demo);
return`<div class="top"><div><div class="logo">MIO</div><div class="slogan">Tus finanzas, tu control</div></div><button class="ib" onclick="eye()" aria-label="Ocultar valores">${S.hide?'🙈':'👁️'}</button></div>
${dm?`<div class="glass demo"><div class="grow"><b>Datos de demostración</b><br>Son ejemplos, no tus finanzas.</div><button class="btn s sm" onclick="clearDemo()">Borrar demo</button></div>`:''}
${mnav()}
<div class="glass hero"><div class="l">Balance del mes</div><div class="big">${cop(i-g)}</div><div class="pills"><div class="pill"><small>↑ Ingresos</small><b>${cop(i)}</b></div><div class="pill"><small>↓ Gastos</small><b>${cop(g)}</b></div></div></div>
<div class="glass"><h2>Gastos por categoría</h2>${donut(l)}</div>
<div class="glass"><h2>🐜 Gastos hormiga</h2><p class="mut">MIO analiza gastos de hasta ${new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(HM)} y los considera repetidos al llegar a 3 compras pequeñas en la misma categoría durante el mes.</p>${h.length?`<h3 style="font-size:15px;margin-top:12px">Detectados este mes</h3>`+h.map(x=>`<div class="row" style="cursor:default"><div class="ic" style="background:${catInfo(x.c)[1]}26">${catInfo(x.c)[0]}</div><div class="grow"><b>${esc(x.c)}</b><small>${x.n} compras pequeñas</small></div><div class="amt warn">${cop(x.s)}</div></div>`).join('')+`<p style="margin-top:8px">Total detectado: <b>${cop(hs)}</b>. Si se repitiera cada mes, equivaldría a <b>${cop(hs*12)}</b> al año.</p>`:'<p class="empty">Aún no hay categorías que cumplan las condiciones de gasto hormiga.</p>'}${smallExpenseGroups(l).filter(x=>x.n<3).length?`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--st)"><h3 style="font-size:15px;margin-bottom:6px">En seguimiento</h3><p class="mut">Estas categorías tienen compras pequeñas, pero todavía no alcanzan las 3 necesarias para activar la detección.</p>`+smallExpenseGroups(l).filter(x=>x.n<3).map(x=>`<div class="row" style="cursor:default"><div class="ic" style="background:${catInfo(x.c)[1]}26">${catInfo(x.c)[0]}</div><div class="grow"><b>${esc(x.c)}</b><small>${x.n} de 3 compras · faltan ${x.remaining}</small></div><div class="amt">${cop(x.s)}</div></div>`).join('')+'</div>':''}</div>
<div class="glass"><h2>Últimos movimientos</h2>${l.length?l.slice(0,5).map(rowTx).join('')+'<button class="btn s" style="margin-top:10px" onclick="go(\'movs\')">Ver todos</button>':'<p class="empty">Aún no hay movimientos.</p>'}</div>
${salaryCard()}<div class="glass"><h2>👤 Mi perfil</h2><p class="mut" style="margin-bottom:10px">Estos datos se guardan únicamente en este navegador y aparecerán en tus reportes.</p><label>Nombre</label><input id="profileName" maxlength="70" autocomplete="name" placeholder="Tu nombre" value="${esc(S.profile&&S.profile.name||'')}"><label>Número de teléfono con indicativo de país</label><input id="profilePhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="Ej. +57 3001234567" value="${esc(S.profile&&S.profile.phone||'')}"><button class="btn s" style="margin-top:10px" onclick="saveProfile()">Guardar perfil</button><p class="mut" style="margin-top:10px">MIO no crea una cuenta ni envía tus datos a un servidor. El teléfono se utiliza para preparar el envío del reporte por WhatsApp.</p></div><div class="glass"><h2>Tus datos</h2><p class="mut" style="margin-bottom:10px">Tus movimientos se guardan solo en este navegador y dispositivo. Exporta tus reportes para conservar una copia.</p><button class="btn s" onclick="wipe()">Borrar todos los datos</button></div>`}

function movs(){let l=mtx();if(flt!='all')l=l.filter(t=>t.t==flt);
return`<div class="top"><h1 style="font-size:26px">Movimientos</h1><button class="ib" onclick="eye()">${S.hide?'🙈':'👁️'}</button></div>${mnav()}
<div class="seg">${[['all','Todos'],['i','Ingresos'],['g','Gastos']].map(([k,n])=>`<button class="${flt==k?'on':''}" onclick="flt='${k}';render()">${n}</button>`).join('')}</div>
<div class="glass">${l.length?l.map(rowTx).join(''):'<p class="empty">No hay movimientos. Toca + para agregar uno.</p>'}</div>`}

function bud(){const l=mtx(),sp=Object.fromEntries(byCat(l)),keys=[...new Set([...(S.customCats||[]).filter(x=>x.type==='g').map(x=>x.name)])],tl=keys.reduce((a,k)=>a+(Number(S.bud[k])||0),0),ts=keys.reduce((a,k)=>a+(sp[k]||0),0);
return`<div class="top"><h1 style="font-size:26px">Presupuestos</h1><button class="ib" onclick="eye()">${S.hide?'🙈':'👁️'}</button></div>${mnav()}
<div class="glass hero"><div class="l">Gastado de lo presupuestado</div><div class="big" style="font-size:28px">${cop(ts)} / ${cop(tl)}</div></div>

function printReportFallback(lines,title,downloadedText){

function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n)}
function goals(){
const l=mtx(),expenses=byCat(l),total=expenses.reduce((a,x)=>a+x[1],0),budgetKeys=[...new Set([...Object.keys(S.bud),...(S.customCats||[]).filter(c=>c.type==='g').map(c=>c.name)])];
const analysis=expenses.slice().sort((a,b)=>b[1]-a[1]);
const over=budgetKeys.map(k=>({name:k,limit:Number(S.bud[k])||0,spent:expenses.find(x=>x[0]===k)?.[1]||0})).filter(x=>x.limit>0&&x.spent>x.limit).sort((a,b)=>(b.spent-b.limit)-(a.spent-a.limit));
const under=budgetKeys.map(k=>({name:k,limit:Number(S.bud[k])||0,spent:expenses.find(x=>x[0]===k)?.[1]||0})).filter(x=>x.limit>0&&x.spent<=x.limit).sort((a,b)=>(b.limit-b.spent)-(a.limit-a.spent));
const moneyPercent=v=>total?Math.round(v/total*100):0;
return`<div class="top"><h1 style="font-size:26px">Metas y educación financiera</h1><button class="ib" onclick="eye()">${S.hide?'🙈':'👁️'}</button></div>${mnav()}
<div class="glass"><h2>📊 ¿Dónde estás gastando más?</h2><p class="mut" style="margin-bottom:10px">Resumen de tus gastos del mes seleccionado: ${mlabel()}. MIO compara los movimientos registrados con los presupuestos que tú definiste.</p>${analysis.length?analysis.map(([k,v],i)=>{const pct=moneyPercent(v),b=Number(S.bud[k])||0,overNow=b>0&&v>b;return`<div class="row" style="cursor:default"><div class="ic" style="background:${catInfo(k)[1]}26">${catInfo(k)[0]}</div><div class="grow"><b>${i+1}. ${esc(k)}</b><small>${pct}% de los gastos${b?' · límite '+cop(b):' · sin límite definido'}</small><div class="bar"><i style="width:${total?Math.min(100,v/total*100):0}%;background:${overNow?'var(--red)':catInfo(k)[1]} "></i></div>${overNow?`<small style="color:var(--red);font-weight:700">Te pasaste por ${cop(v-b)}</small>`:b?`<small class="mut">${cop(b-v)} disponibles del presupuesto</small>`:''}</div><div class="amt ${overNow?'warn':''}">${cop(v)}</div></div>`}).join(''):'<p class="empty">Todavía no hay gastos para analizar. Registra movimientos y define presupuestos para comparar.</p>'}</div>
<div class="glass"><h2>🚦 Control de presupuestos</h2>${over.length?`<p style="font-weight:700;color:var(--red);margin-bottom:8px">⚠️ Te excediste en ${over.length} ${over.length===1?'categoría':'categorías'}.</p>`+over.map(x=>`<div class="row" style="cursor:default"><div class="grow"><b>${esc(x.name)}</b><small>Límite ${cop(x.limit)} · gastado ${cop(x.spent)}</small></div><div class="amt" style="color:var(--red)">+${cop(x.spent-x.limit)}</div></div>`).join(''):'<p class="mut">No hay presupuestos excedidos en el mes seleccionado. Si todavía no has definido límites, entra en Presupuesto y establece cuánto quieres gastar por categoría.</p>'}${under.length?`<h3 style="font-size:15px;margin-top:14px">Dentro del presupuesto</h3>`+under.slice(0,5).map(x=>`<div class="row" style="cursor:default"><div class="grow"><b>${esc(x.name)}</b><small>Gastado ${cop(x.spent)} de ${cop(x.limit)}</small></div><div class="amt in">${cop(x.limit-x.spent)} libres</div></div>`).join(''):''}<button class="btn s" style="margin-top:10px" onclick="go('bud')">Revisar mis presupuestos</button></div>
<div class="glass"><h2>🎓 Mini curso de educación financiera</h2><p class="mut" style="margin-bottom:12px">Lecciones prácticas para entender tus hábitos y tomar decisiones. Son recomendaciones educativas, no asesoría financiera personalizada.</p>
<details style="padding:12px 0;border-bottom:1px solid var(--st)"><summary style="font-weight:700;cursor:pointer">Lección 1 · Conoce en qué gastas</summary><p style="margin-top:8px">Durante 30 días registra cada ingreso y cada gasto, incluso los pequeños. Al final del mes, ordena las categorías de mayor a menor. No juzgues el gasto: primero identifica el patrón.</p><p class="mut" style="margin-top:6px">Ejercicio: revisa las tres categorías con mayor valor en el análisis de arriba.</p></details>
<details style="padding:12px 0;border-bottom:1px solid var(--st)"><summary style="font-weight:700;cursor:pointer">Lección 2 · Define límites realistas</summary><p style="margin-top:8px">Asigna un presupuesto mensual a cada categoría según tus ingresos y gastos necesarios. Divide el límite entre las semanas del mes para tener una referencia semanal. Ajusta el presupuesto si tus necesidades reales no caben; no uses límites imposibles.</p><p class="mut" style="margin-top:6px">Ejercicio: abre Presupuesto y fija un límite para la categoría donde más gastas.</p></details>
<details style="padding:12px 0;border-bottom:1px solid var(--st)"><summary style="font-weight:700;cursor:pointer">Lección 3 · Qué hacer si te pasas</summary><p style="margin-top:8px">Cuando superes un límite, revisa qué compras lo causaron. Diferencia gastos esenciales de gastos que puedes aplazar. Reduce o pausa temporalmente una compra no esencial y actualiza el plan para el siguiente mes. No recortes necesidades básicas para compensar.</p><p class="mut" style="margin-top:6px">Ejercicio: elige una acción concreta para la categoría excedida más alta.</p></details>
<details style="padding:12px 0;border-bottom:1px solid var(--st)"><summary style="font-weight:700;cursor:pointer">Lección 4 · Mejora el hábito de ahorro</summary><p style="margin-top:8px">Ahorra una cantidad sostenible cuando recibas ingresos, aunque sea pequeña. Si tienes deudas costosas, compara sus intereses y prioriza un plan de pago sin dejar de cubrir necesidades esenciales. Revisa el progreso cada semana.</p><p class="mut" style="margin-top:6px">Ejercicio: crea una meta de ahorro y programa una revisión semanal.</p></details>
<details style="padding:12px 0"><summary style="font-weight:700;cursor:pointer">Lección 5 · Reduce gastos hormiga sin culpa</summary><p style="margin-top:8px">Busca compras pequeñas que se repiten. Calcula su total mensual y decide cuáles realmente disfrutas y cuáles podrías reducir. El objetivo no es eliminar todo gusto, sino gastar de forma consciente.</p><p class="mut" style="margin-top:6px">Ejercicio: escoge una categoría de gastos pequeños y prueba un límite durante 7 días.</p></details></div>
<div class="glass"><h2>🎯 Metas de ahorro</h2>${S.goals.map(x=>{const p=x.T>0?Math.min(100,x.s/x.T*100):0;return`<div class="row" style="display:block;cursor:default"><div style="display:flex;justify-content:space-between;align-items:center"><b>🎯 ${esc(x.n)}${x.demo?'<span class="chip">DEMO</span>':''}</b><button class="ib" style="width:42px;height:42px;font-size:17px" onclick="openGoal('${x.id}')" aria-label="Editar meta">✏️</button></div><div class="bar"><i style="width:${p}%;background:linear-gradient(90deg,var(--g),var(--t),var(--b))"></i></div><div style="display:flex;justify-content:space-between"><b>${cop(x.s)}</b><span class="mut">${S.hide?'••':Math.round(p)+'%'} de ${cop(x.T)}</span></div><button class="btn s" style="margin-top:8px" onclick="openAbono('${x.id}')">Abonar a esta meta</button></div>`}).join('')||'<p class="empty">Aún no tienes metas de ahorro.</p>'}<button class="btn" onclick="openGoal()">+ Nueva meta</button></div>`
}

let tt='g',ed=null;

function txForm(){const e=ed,cats=catNames(tt),td=e?e.d:`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
sheet(`<h2>${e?'Editar movimiento':'Nuevo movimiento'}</h2><div class="seg"><button class="${tt=='g'?'on':''}" onclick="sw('g')">Gasto</button><button class="${tt=='i'?'on':''}" onclick="sw('i')">Ingreso</button></div>
<label>Valor en pesos colombianos (COP)</label>${amtInput('fa',e&&e.a)}

${e?'<button class="btn d" style="margin-top:10px" onclick="delTx()">Eliminar</button>':''}<button class="btn s" style="margin-top:10px" onclick="cl()">Cancelar</button>`)}
function sw(t){const k={a:num('#fa'),n:$('#fn').value,d:$('#fd').value};tt=t;txForm();$('#fa').value=k.a?new Intl.NumberFormat('es-CO').format(k.a):'';$('#fn').value=k.n;$('#fd').value=k.d}
function saveTx(){const a=num('#fa'),d=$('#fd').value;if(!Number.isSafeInteger(a)||a<=0||a>1000000000000){toast('Ingresa un valor entre $1 y $1.000.000.000.000 COP');return}if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d)||(()=>{const p=d.split('-').map(Number),x=new Date(p[0],p[1]-1,p[2]);return x.getFullYear()!==p[0]||x.getMonth()!==p[1]-1||x.getDate()!==p[2]})()){toast('Elige una fecha válida');return}
const category=$('#fc').value;if(!category){toast('Primero crea o selecciona una categoría');return}const o={t:tt,c:category,a,n:$('#fn').value.trim().slice(0,40),d};
if(ed){Object.assign(ed,o,{demo:false})}else S.tx.push({id:uid(),...o});
const[y,m]=d.split('-');M={y:+y,m:+m-1};save();cl();render();toast(ed?'Cambios guardados':'Movimiento guardado');if(!ed&&tt==='i'&&o.c==='Salario')salaryPlan(o.a,o.d)}
function salaryPlan(amount,date){sheet(`<h2>💰 Recomendación para tu salario</h2><p class="mut">MIO te propone una distribución 50/30/20. Es una guía: puedes cambiar los porcentajes y solo se guardará el plan si lo aceptas.</p><div class="glass" style="margin-top:12px"><b>Salario registrado: ${cop(amount)}</b><label>Necesidades (%)</label><input id="pNeed" type="number" min="0" max="100" value="50" oninput="updatePlan(${amount})"><label>Deseos y gastos personales (%)</label><input id="pWant" type="number" min="0" max="100" value="30" oninput="updatePlan(${amount})"><label>Ahorro y pago de deudas (%)</label><input id="pSave" type="number" min="0" max="100" value="20" oninput="updatePlan(${amount})"><div id="planPreview" style="margin-top:12px;line-height:1.8"><div>🏠 Necesidades: <b>${cop(Math.round(amount*.5))}</b></div><div>🎉 Deseos: <b>${cop(Math.round(amount*.3))}</b></div><div>🌱 Ahorro/deudas: <b>${cop(Math.round(amount*.2))}</b></div><small class="mut">Total: 100 %</small></div></div><button class="btn" onclick="acceptPlan(${amount},'${date}')">Aceptar distribución</button><button class="btn s" style="margin-top:10px" onclick="cl()">Ahora no</button>`)}
function updatePlan(amount){const n=Number($('#pNeed').value)||0,w=Number($('#pWant').value)||0,s=Number($('#pSave').value)||0;const ok=[n,w,s].every(x=>x>=0&&x<=100)&&n+w+s===100;$('#planPreview').innerHTML=`<div>🏠 Necesidades: <b>${cop(Math.round(amount*n/100))}</b></div><div>🎉 Deseos: <b>${cop(Math.round(amount*w/100))}</b></div><div>🌱 Ahorro/deudas: <b>${cop(Math.round(amount*s/100))}</b></div><small style="color:${ok?'var(--g)':'var(--red)'}">${ok?'Total: 100 %. Distribución válida.':'Los porcentajes deben sumar exactamente 100 %.'}</small>`}
function acceptPlan(amount,date){const n=Number($('#pNeed').value),w=Number($('#pWant').value),s=Number($('#pSave').value);if(![n,w,s].every(x=>Number.isFinite(x)&&x>=0&&x<=100)||n+w+s!==100){toast('Los porcentajes deben sumar 100 %');return}S.salaryPlan={amount,date,needsPct:n,wantsPct:w,savingPct:s,needs:Math.round(amount*n/100),wants:Math.round(amount*w/100),saving:Math.round(amount*s/100),acceptedAt:new Date().toISOString()};if(!save())return;cl();render();sheet(`<h2>✅ Distribución guardada</h2><p>Tu plan para este salario quedó registrado:</p><p style="line-height:1.9;margin:12px 0">🏠 Necesidades: <b>${cop(S.salaryPlan.needs)}</b><br>🎉 Deseos: <b>${cop(S.salaryPlan.wants)}</b><br>🌱 Ahorro y deudas: <b>${cop(S.salaryPlan.saving)}</b></p><button class="btn" onclick="cl();render()">Entendido</button>`)}

function abono(){const a=num('#ga');if(!Number.isSafeInteger(a)||a<=0||a>1000000000000||eg.s+a>1000000000000){toast('Ingresa un abono válido');return}eg.s+=a;eg.demo=false;save();cl();render();toast('Abono registrado')}

function clearDemo(){S.tx=S.tx.filter(t=>!t.demo);S.goals=S.goals.filter(x=>!x.demo);save();render();toast('Datos demo borrados')}
function wipe(){sheet(`<h2>¿Borrar todo?</h2><p class="mut">Se eliminarán movimientos, presupuestos y metas de este dispositivo.</p><div style="height:16px"></div><button class="btn d" onclick="S={hide:S.hide,customCats:[],tx:[],bud:{},goals:[],salaryPlan:null,profile:S.profile||{name:'',phone:''}};save();cl();render();toast('Datos borrados')">Sí, borrar todo</button><button class="btn s" style="margin-top:10px" onclick="cl()">Cancelar</button>`)}
try{render()}catch(e){console.error('MIO render error:',e);showErr(e&&e.message||'No se pudo dibujar la pantalla principal. '+e)}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('PWA offline no disponible:',e)));}
</script></body></html>
